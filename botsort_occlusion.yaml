tracker_type: botsort
track_high_thresh: 0.25   # first-pass matching uses detections above this
track_low_thresh: 0.05    # second pass for occluded/low-conf boxes (needs model.track(conf) <= this!)
new_track_thresh: 0.6     # a detection must be this confident to spawn a NEW ID (higher = fewer new IDs)
track_buffer: 300         # frames a lost track is kept (~10 s at 30 fps)
match_thresh: 0.8         # max association cost; 1.0 accepts anything and causes ID swaps
fuse_score: True
gmc_method: none          # static camera; use sparseOptFlow if the camera moves
proximity_thresh: 0.1     # min IoU before ReID may be used. LOWER = ReID can link boxes that moved during occlusion
appearance_thresh: 0.6    # min appearance similarity for ReID. HIGHER = stricter. Raise if similar-looking people swap
with_reid: True
model: auto               # uses YOLO's own features; if unsupported for pose in your version, try yolo11n-cls.pt

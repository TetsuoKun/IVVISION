tracker_type: botsort

track_high_thresh: 0.25
track_low_thresh: 0.05
new_track_thresh: 0.55     # main change: fewer spurious new IDs

track_buffer: 600
match_thresh: 0.8
fuse_score: True

gmc_method: sparseOptFlow  # use None if the camera is static

proximity_thresh: 0.5
appearance_thresh: 0.75

with_reid: True
model: auto
